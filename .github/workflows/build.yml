name: Build CarsonBoot

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-uefi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GNU-EFI toolchain and Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gnu-efi dpkg-dev

      - name: Build UEFI application
        run: make

      - name: Verify EFI binary
        run: file build/BOOTX64.EFI

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Inspect Debian package
        run: |
          dpkg-deb --info build/deb/carsonboot_0.1.0_amd64.deb
          dpkg-deb --contents build/deb/carsonboot_0.1.0_amd64.deb
          echo "## Debian package" >> "$GITHUB_STEP_SUMMARY"
          echo ' `carsonboot_0.1.0_amd64.deb` was built successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download it from the **CarsonBoot-Debian-Package** artifact below.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: CarsonBoot-Debian-Package
          path: build/deb/carsonboot_0.1.0_amd64.deb
          if-no-files-found: error
          compression-level: 0

      - name: Upload UEFI executable
        uses: actions/upload-artifact@v4
        with:
          name: CarsonBoot-UEFI
          path: build/BOOTX64.EFI
          if-no-files-found: error
          compression-level: 0
