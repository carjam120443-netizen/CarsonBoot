name: Build CarsonBoot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-uefi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GNU-EFI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gnu-efi

      - name: Build UEFI application
        run: make

      - name: Verify EFI binary
        run: file build/BOOTX64.EFI

      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarsonBoot-UEFI-x86_64
          path: build/BOOTX64.EFI
